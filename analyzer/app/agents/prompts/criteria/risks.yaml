- code: CLIENT_WANTS_TO_LEAVE
  block: risk
  title: Клиент собирается уйти в другой банк
  description: Клиент прямо говорит о намерении прекратить отношения с банком или перейти к конкуренту.
  rules: Верни 0 только при явном намерении клиента уйти, закрыть отношения или выбрать другой банк.
  trigger: Клиент говорит, что уйдёт в другой банк, закроет продукты или больше не хочет обслуживаться.
  positive_definition: Явного намерения уйти из банка нет.
  negative_definition: Клиент прямо сообщает о намерении уйти или перейти к конкуренту.
  good_examples:
    - Пока останусь вашим клиентом.
  bad_examples:
    - Я уйду в другой банк, вы мне надоели.
  output_rule: Верни 0 при обнаружении риска ухода, иначе 1.
  penalty: 0
  critical: false
  severity: high
  quote_required: true
  recommendation: Уточните причину недовольства и предложите конкретный вариант удержания клиента.

- code: CLIENT_DISLIKES_BANK_TERMS
  block: risk
  title: Клиента не устраивают условия банка
  description: Клиент выражает явное недовольство условиями, ставкой, тарифом или предложением банка.
  rules: Верни 0 при прямом негативном отношении к условиям банка независимо от продукта.
  trigger: Клиент говорит, что условия, ставка, тариф или предложение его не устраивают.
  positive_definition: Клиент не выражает явного недовольства условиями банка.
  negative_definition: Клиент прямо сообщает, что условия банка его не устраивают.
  good_examples:
    - Условия мне понятны, я подумаю.
  bad_examples:
    - Меня вообще не устраивают ваши условия.
  output_rule: Верни 0 при обнаружении риска недовольства условиями, иначе 1.
  penalty: 0
  critical: false
  severity: medium
  quote_required: true
  recommendation: Уточните, какие условия не устраивают клиента, и предложите подходящую альтернативу.
