code: DEP_01
title_positive: Сотрудник сообщил о приближении окончания или завершении вклада
title_negative: Менеджер не сообщил причину контакта по вкладу
description: 'Менеджер должен объяснить причину звонка: у клиента закончился или скоро заканчивается вклад/депозит, либо есть вопрос по переоткрытию/пролонгации.'
rules: Звонок про вклад, депозит, переоформление, пролонгацию или размещение средств.
trigger: Менеджер сразу переходит к продукту или ставке, не объясняя клиенту причину контакта.
positive_definition: Менеджер корректно сообщает, что вклад закончился/заканчивается, или подтверждает запрос клиента по вкладу.
negative_definition: Менеджер сразу переходит к продукту или ставке, не объясняя клиенту причину контакта.
good_examples:
- Менеджер корректно сообщает, что вклад закончился/заканчивается, или подтверждает запрос клиента по вкладу.
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_01.
block: deposit
severity: minor
penalty: 5
quote_required: true
recommendation: 'В начале звонка кратко обозначайте причину контакта: окончание вклада, переоформление, пролонгация или запрос клиента.'
