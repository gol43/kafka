code: DEP_14
title_positive: Корректно обработан отказ клиента
title_negative: Отказ клиента обработан некорректно
description: Если клиент не готов открывать вклад или условия не подходят, менеджер должен корректно зафиксировать отказ или предложить допустимый следующий шаг.
rules: Клиент выражает отказ, сомнение или недовольство условиями.
trigger: Менеджер игнорирует отказ, продолжает давить или переводит на закрытую линейку без основания.
positive_definition: Менеджер признает отказ/сомнение, уточняет причину и предлагает корректный следующий шаг.
negative_definition: Менеджер игнорирует отказ, продолжает давить или переводит на закрытую линейку без основания.
good_examples:
- Менеджер признает отказ/сомнение, уточняет причину и предлагает корректный следующий шаг.
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_14.
block: deposit
severity: minor
penalty: 5
quote_required: true
recommendation: При отказе спокойно уточните причину, зафиксируйте позицию клиента и предложите допустимый следующий шаг.
