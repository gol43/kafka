code: DEP_06
title_positive: Корректно раскрыт срок вклада
title_negative: Срок вклада не раскрыт
description: При предложении вклада должен быть понятен срок размещения или срок должен быть уточнен как следующий шаг.
rules: Предлагается вклад или открытие/переоткрытие вклада.
trigger: Срок не назван и не уточнен, клиент не понимает длительность продукта.
positive_definition: Назван срок вклада или обозначено, что срок будет уточнен/согласован.
negative_definition: Срок не назван и не уточнен, клиент не понимает длительность продукта.
good_examples:
- Назван срок вклада или обозначено, что срок будет уточнен/согласован.
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_06.
block: deposit
severity: minor
penalty: 7
quote_required: true
recommendation: Озвучивайте срок вклада вместе со ставкой и ключевыми условиями.
