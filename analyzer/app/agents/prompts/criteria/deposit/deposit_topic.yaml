code: DEPOSIT_TOPIC
title_positive: Определение применимости проверки вкладов
title_negative: Тема вкладов отсутствует
description: Критерий определяет, есть ли в звонке тема переоформления, пролонгации, окончания или предложения вклада. Если звонок не полный или не касается темы вкладов, правила по вкладам не оцениваются
rules: Любой звонок из входного файла.
trigger: Проверка вкладов применяется к звонку, где нет темы вклада/депозита/размещения средств. Не применимо, если идет обсуждение инвестиций, ОФЗ, ПИФ,ДУ,брокерского обслуживания. Проверка осуществляется исключительно только если диалог ведется про предложение вкладов.
positive_definition: 'Проверка вкладов запускается только если есть слова или смыслы: вклад, депозит, окончание вклада, ставка, пролонгация, размещение средств.'
negative_definition: Проверка вкладов применяется к звонку, где нет темы вклада/депозита/размещения средств. Не применимо, если идет обсуждение инвестиций, ОФЗ, ПИФ,ДУ,брокерского обслуживания. Проверка осуществляется исключительно только если диалог ведется про предложение вкладов.
good_examples:
- 'Проверка вкладов запускается только если есть слова или смыслы: вклад, депозит, окончание вклада, ставка, пролонгация, размещение средств.'
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_00.
block: deposit
severity: info
penalty: 0
quote_required: false
recommendation: Если тема вкладов отсутствует, не оценивайте вкладный стандарт и рассчитывайте итоговый балл только по общей коммуникации или коммуникации по демаркированию (если применимо)
