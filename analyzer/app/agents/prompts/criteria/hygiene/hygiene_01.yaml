code: HYG_01
title_positive: Представление
title_negative: КМ не представился
description: Менеджер не назвал свое имя и/или роль в начале коммуникации.
rules: Первичный контакт или новый звонок; не применять, если это явное продолжение того же разговора. Если в транскрибации есть формулировка " ", СберПервый, считать верным сигналом. Если указано ВИПофис Сбербанка, ВИП ВСП, офис Сбербанка считать как отклонение. Имя в транкрибации маскировано и указано как " ", не считать как отклонение.
trigger: В первых репликах нет представления по роли или упоминание "СберПервый".
positive_definition: '«Здравствуйте, " ",

  персональный банкир",'
negative_definition: В первых репликах нет представления по роли или упоминание "СберПервый".
good_examples: []
bad_examples: []
output_rule: В первых репликах нет представления по роли или упоминание "СберПервый".
block: hygiene
severity: significant
penalty: 5
