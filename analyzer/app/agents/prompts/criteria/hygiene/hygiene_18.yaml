code: HYG_18
block: hygiene
title_positive: Компетентность
title_negative: Менеджер показал некомпетентность
description: Менеджер сообщает клиенту, что не разбирается и не может помочь.
rules: Любой звонок.
trigger: Фразы «я не знаю», «я не разбираюсь» без маршрута решения.
positive_definition: Менеджер признает необходимость уточнить и берет ответственность за следующий шаг.
negative_definition: Фразы «я не знаю», «я не разбираюсь» без маршрута решения.
good_examples: []
bad_examples: []
output_rule: Фразы «я не знаю», «я не разбираюсь» без маршрута решения.
severity: critical
penalty: 12
quote_required: true
recommendation: Если вы не знаете ответ, то обьясните клиенту, что уточните информацию и вернетесь с  ответом в указанный вами срок. Не используйте в диалоге фразы "Я не разбираюсь", "Я не знаю".
