code: RISK_01
title_positive: "Клиент не планирует уходить из банка"
title_negative: "Клиент планирует уйти из банка"
description: "Клиент прямо говорит о прекращении отношений с банком или обслуживанием либо называет это вероятным следующим шагом."
rules: "Не фиксировать обсуждение ухода третьего лица, отрицание намерения уйти и гипотетический пример без намерения клиента."
trigger: "Клиент говорит, что уйдёт из банка, закроет всё или больше не хочет обслуживаться."
positive_definition: "Явного намерения прекратить отношения с банком нет."
negative_definition: "Клиент прямо сообщает о намерении прекратить обслуживание или ставит это как вероятный следующий шаг."
good_examples:
  - "Уходить из банка я не собираюсь."
bad_examples:
  - "Уйду из банка."
  - "Закрою всё, здесь больше обслуживаться не хочу."
  - "Тогда я ухожу."
output_rule: "Верни 0 при обнаружении риска ухода, иначе 1."
block: risk
severity: high
penalty: 0
quote_required: true
recommendation: "Уточните причину недовольства и предложите конкретный вариант удержания клиента."
