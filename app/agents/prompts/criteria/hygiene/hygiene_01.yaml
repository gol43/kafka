code: "HYG_01"
title_positive: "Представление"
title_negative: "КМ не представился"
description: "Менеджер не назвал свое имя и/или роль в начале коммуникации."
rules: "Первичный контакт или новый звонок; не применять, если это явное продолжение того же разговора. Если в транскрибации есть формулировка1 \" \", СберПервый, считать верным сигналом. Если указано ВИПофис Сбербанка, ВИП ВСП, офис Сбербанка считать как отклонение. Имя в транкрибации маскировано и указано как \" \", не считать как отклонение. Комментарий БТ: Проверяем первый ли звонокКороткие диалоги до 50 секунд не учитываем совсем"
trigger: "В первых репликах нет представления по роли или упоминание \"СберПервый\"."
positive_definition: "«Здравствуйте, \" \", персональный банкир\","
negative_definition: "В первых репликах нет представления по роли или упоминание \"СберПервый\"."
good_examples:
  - "Здравствуйте, меня зовут [DATA_NAME], я персональный банкир СберПервого."
bad_examples:
  - "Здравствуйте. Чем могу помочь?"
output_rule: "Верни score=0, если подтверждён триггер нарушения: В первых репликах нет представления по роли или упоминание \"СберПервый\". Во всех остальных случаях верни score=1. При score=0 верни точную короткую цитату из диалога."
block: hygiene
severity: significant
penalty: 5
quote_required: true
recommendation: "В начале звонка представляйтесь: имя + роль + при необходимости название подразделения - СберПервый."
