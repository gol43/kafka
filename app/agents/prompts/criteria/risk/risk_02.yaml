code: "RISK_02"
title_positive: "Клиент не планирует выводить средства"
title_negative: "Клиент планирует вывести средства"
description: "Клиент сообщает о намерении вывести или перевести существенную часть средств из банка либо связывает перевод с неудовлетворённостью."
rules: "Не фиксировать обычную операцию без признака ухода: перевод родственнику, платёж, перевод между своими счетами в Сбере или общий вопрос о снятии денег."
trigger: "Клиент намерен перевести деньги в другой банк, вывести средства, снять всё или забрать вклады."
positive_definition: "Явного намерения вывести существенную часть средств из банка нет."
negative_definition: "Клиент сообщает о намерении вывести или перевести существенную часть средств из банка либо связывает перевод с неудовлетворённостью."
good_examples:
  - "Как перевести деньги между моими счетами?"
  - "Как снять часть денег для покупки?"
bad_examples:
  - "Переведу деньги в другой банк."
  - "Выведу средства."
  - "Сниму всё."
  - "Заберу вклад и переведу туда."
output_rule: "Верни score=0 при наличии указанного риска, иначе score=1. При score=0 верни точную короткую цитату клиента, подтверждающую риск."
block: risk
severity: critical
risk_level: high
penalty: 0
quote_required: true
recommendation: "Уточните причину вывода средств и предложите релевантный вариант удержания."
