code: RISK_02
block: risk
title_positive: "Клиент не планирует выводить средства"
title_negative: "Клиент планирует вывести средства"
description: "Клиент сообщает о намерении снять или перевести существенную часть средств из банка либо связывает перевод с недовольством."
rules: "Не фиксировать обычный платеж, перевод родственнику или сотруднику, перевод между своими счетами и общий вопрос о снятии денег без намерения вывести средства из банка."
trigger: "Клиент намерен перевести деньги в другой банк, вывести средства, снять всё или забрать вклады."
positive_definition: "Явного намерения вывести существенную часть средств из банка нет."
negative_definition: "Клиент прямо сообщает о выводе средств или связывает перевод с неудовлетворенностью банком."
good_examples: ["Как перевести деньги между моими счетами?"]
bad_examples: ["Переведу деньги в другой банк.", "Сниму всё и заберу вклады."]
output_rule: "Верни score=0 при обнаружении риска вывода средств, иначе score=1."
severity: high
penalty: 0
quote_required: true
recommendation: "Уточните причину вывода средств и предложите релевантный вариант удержания."
