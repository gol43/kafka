code: "RISK_03"
title_positive: "Клиент не планирует выбрать конкурента"
title_negative: "Клиент планирует выбрать конкурента"
description: "Клиент сравнивает предложение или сервис с другим банком и выражает намерение выбрать конкурента или разместить средства там."
rules: "Не фиксировать нейтральное упоминание другого банка без сравнения или намерения, а также отрицание перехода."
trigger: "Клиент сообщает, что у конкурента условия или сервис лучше, и выражает намерение выбрать конкурента или разместить средства там."
positive_definition: "Нет сочетания сравнения с конкурентом и намерения клиента выбрать его."
negative_definition: "Клиент сравнивает предложение или сервис с другим банком и выражает намерение выбрать конкурента или разместить средства там."
good_examples:
  - "Я видел предложение другого банка, но переходить не собираюсь."
bad_examples:
  - "В другом банке мне предложили лучше."
  - "Размещу деньги там."
  - "Там решили за день."
  - "Посмотрю предложение другого банка и решу."
output_rule: "Верни score=0 при наличии указанного риска, иначе score=1. При score=0 верни точную короткую цитату клиента, подтверждающую риск."
block: risk
severity: significant
risk_level: medium
penalty: 0
