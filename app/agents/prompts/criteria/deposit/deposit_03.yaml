code: DEP_03
title_positive: Особый Плюс предлагается только после отказа клиента от публичной линейки
title_negative: Особый Плюс предложен до отказа
description: Закрытая линейка/Особый Плюс допустима только после того, как клиент отказался, не согласился со ставкой или сообщил, что стандартные условия его не устраивают.
rules: Есть обсуждение Особого Плюса или индивидуального/закрытого предложения.
trigger: Особый Плюс предложен до отказа клиента или до выявления неудовлетворенности публичными условиями.
positive_definition: Клиент сначала отказался от публичной линейки или сказал, что условия не подходят; только затем сотрудник предлагает Особый Плюс.
negative_definition: Особый Плюс предложен до отказа клиента или до выявления неудовлетворенности публичными условиями.
good_examples:
- Клиент сначала отказался от публичной линейки или сказал, что условия не подходят; только затем сотрудник предлагает Особый Плюс.
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_03.
block: deposit
severity: critical
penalty: 20
quote_required: true
recommendation: Не предлагайте Особый Плюс первым шагом. Сначала зафиксируйте реакцию клиента на публичную линейку.
