code: "DEP_03"
title_positive: "Особый Плюс предлагается только после отказа клиента от публичной линейки"
title_negative: "Особый Плюс предложен до отказа"
description: "Закрытая линейка/Особый Плюс допустима только после того, как клиент отказался, не согласился со ставкой или сообщил, что стандартные условия его не устраивают."
rules: "Есть обсуждение Особого Плюса или индивидуального/закрытого предложения. Этап коммуникации: Работа с реакцией клиента. Когда не применять: Клиент уже полностью сформулировал запрос и необходимые параметры известны.. Обязательная проверка: Уточнить только существенные для решения параметры: сумма, срок, доступность, пополнение/снятие, цель.."
trigger: "Особый Плюс предложен до отказа клиента или до выявления неудовлетворенности публичными условиями."
positive_definition: "Клиент сначала отказался от публичной линейки или сказал, что условия не подходят; только затем сотрудник предлагает Особый Плюс."
negative_definition: "Особый Плюс предложен до отказа клиента или до выявления неудовлетворенности публичными условиями."
good_examples:
  - "Стандартные условия вам не подходят, поэтому могу уточнить Особый Плюс."
bad_examples:
  - "Сразу оформим Особый Плюс, публичные вклады рассматривать не будем."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_03. Верни score=0, если подтверждён триггер нарушения: Особый Плюс предложен до отказа клиента или до выявления неудовлетворенности публичными условиями. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: critical
penalty: 20
quote_required: true
recommendation: "Не предлагайте Особый Плюс первым шагом. Сначала зафиксируйте реакцию клиента на публичную линейку."
