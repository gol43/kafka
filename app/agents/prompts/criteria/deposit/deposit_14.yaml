code: "DEP_14"
title_positive: "Корректно обработан отказ клиента"
title_negative: "Отказ клиента обработан некорректно"
description: "Если клиент не готов открывать вклад или условия не подходят, менеджер должен корректно зафиксировать отказ или предложить допустимый следующий шаг."
rules: "Клиент выражает отказ, сомнение или недовольство условиями. Этап коммуникации: Работа с реакцией клиента. Обязательная проверка: Проверить критерий «Корректно обработан отказ клиента» по всему релевантному фрагменту диалога, а не по одной реплике.."
trigger: "Менеджер игнорирует отказ, продолжает давить или переводит на закрытую линейку без основания."
positive_definition: "Менеджер признает отказ/сомнение, уточняет причину и предлагает корректный следующий шаг."
negative_definition: "Менеджер игнорирует отказ, продолжает давить или переводит на закрытую линейку без основания."
good_examples:
  - "Понимаю, что условия не подходят. Уточню причину и зафиксирую отказ."
bad_examples:
  - "Вы всё равно должны открыть этот вклад."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_14. Верни score=0, если подтверждён триггер нарушения: Менеджер игнорирует отказ, продолжает давить или переводит на закрытую линейку без основания. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: minor
penalty: 5
quote_required: true
recommendation: "При отказе спокойно уточните причину, зафиксируйте позицию клиента и предложите допустимый следующий шаг."
