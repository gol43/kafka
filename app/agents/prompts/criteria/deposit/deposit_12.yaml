code: DEP_12
title_positive: Корректно определен разговор с середины
title_negative: Разговор с середины определён некорректно
description: Если по контексту видно, что ранее уже договорились об открытии вклада, звонок не должен оцениваться как нарушение первичного предложения.
rules: Есть признаки реализации ранее достигнутой договоренности. Если звонок начинается с реализации ранее согласованного решения, маркируйте его как «Разговор с середины» и не штрафуйте за отсутствие первичного предложения.
trigger: Звонок ошибочно классифицирован как новая продажа, хотя клиент и менеджер уже договорились ранее.
positive_definition: Присвоена метка «Разговор с середины», если идет подтверждение, оформление или реализация ранее согласованного вклада.
negative_definition: Звонок ошибочно классифицирован как новая продажа, хотя клиент и менеджер уже договорились ранее.
good_examples:
- Присвоена метка «Разговор с середины», если идет подтверждение, оформление или реализация ранее согласованного вклада.
