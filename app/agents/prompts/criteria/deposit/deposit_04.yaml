code: "DEP_04"
title_positive: "Особый Плюс допустим при упоминании лучших условий другого банка"
title_negative: "Особый Плюс предложен без основания"
description: "Если клиент говорит, что другой банк предлагает лучшие условия, сотрудник может предложить уточнить индивидуальные условия или закрытую линейку."
rules: "Клиент упоминает другой банк или лучшие рыночные условия. Этап коммуникации: Предложение и консультация. Когда не применять: Клиент уже полностью сформулировал запрос и необходимые параметры известны.. Обязательная проверка: Уточнить только существенные для решения параметры: сумма, срок, доступность, пополнение/снятие, цель.."
trigger: "Сотрудник предлагает Особый Плюс до того, как клиент сказал о лучших условиях другого банка, либо игнорирует явный сигнал клиента."
positive_definition: "Клиент упомянул ВТБ, Альфа-Банк, Газпромбанк, ПСБ, Озонбанк или лучшие условия; после этого сотрудник предлагает индивидуальное решение."
negative_definition: "Сотрудник предлагает Особый Плюс до того, как клиент сказал о лучших условиях другого банка, либо игнорирует явный сигнал клиента."
good_examples:
  - "Вы сообщили о лучших условиях другого банка, поэтому могу уточнить индивидуальный вариант."
bad_examples:
  - "Без сравнения условий сразу предложу Особый Плюс."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_04. Верни score=0, если подтверждён триггер нарушения: Сотрудник предлагает Особый Плюс до того, как клиент сказал о лучших условиях другого банка, либо игнорирует явный сигнал клиента. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: significant
penalty: 15
quote_required: true
recommendation: "Если клиент сравнивает с другим банком, корректно зафиксируйте сигнал и только после этого переходите к индивидуальному варианту."
