code: "DEP_13"
title_positive: "Корректно зафиксирован следующий шаг"
title_negative: "Следующий шаг не зафиксирован"
description: "В конце разговора должен быть понятен результат: открываем, клиент думает, будет перезвон, заявка на согласование, отказ."
rules: "Звонок по вкладам подходит к завершению. Этап коммуникации: Завершение и следующий шаг. Когда не применять: Запрос полностью решен; дальнейший контакт не требуется; разговор завершил клиент.. Обязательная проверка: В финале должен быть понятен результат и следующий шаг.."
trigger: "Нет понятного результата или следующего действия."
positive_definition: "Зафиксировано: согласие, отказ, перезвон, заявка, подтверждение в приложении или другое действие."
negative_definition: "Нет понятного результата или следующего действия."
good_examples:
  - "Сегодня направляю заявку, а завтра сообщаю результат согласования."
bad_examples:
  - "Хорошо, тогда на этом всё."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_13. Верни score=0, если подтверждён триггер нарушения: Нет понятного результата или следующего действия. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: minor
penalty: 5
quote_required: true
recommendation: "В финале фиксируйте итог и следующий шаг: кто, что и когда делает."
