code: DEP_05
title_positive: Корректно раскрыта ставка
title_negative: Ставка раскрыта некорректно
description: При предложении вклада менеджер должен озвучить ставку или объяснить, что ставка требует уточнения/согласования, если это предусмотрено процедурой.
rules: Предлагается вклад или индивидуальное решение.
trigger: Ставка не названа, названа неоднозначно, обещана без условий или без согласования.
positive_definition: Ставка названа корректно либо сотрудник говорит, что ставку нужно уточнить/согласовать.
negative_definition: Ставка не названа, названа неоднозначно, обещана без условий или без согласования.
good_examples:
- Ставка названа корректно либо сотрудник говорит, что ставку нужно уточнить/согласовать.
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_05.
block: deposit
severity: significant
penalty: 10
quote_required: true
recommendation: При предложении вклада называйте ставку корректно и указывайте, если она требует согласования.
