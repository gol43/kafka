code: "DEP_05"
title_positive: "Корректно раскрыта ставка"
title_negative: "Ставка раскрыта некорректно"
description: "При предложении вклада менеджер должен озвучить ставку или объяснить, что ставка требует уточнения/согласования, если это предусмотрено процедурой."
rules: "Предлагается вклад или индивидуальное решение. Этап коммуникации: Предложение и консультация. Обязательная проверка: Проверить полноту раскрытия: ставка, срок и ключевые ограничения продукта.."
trigger: "Ставка не названа, названа неоднозначно, обещана без условий или без согласования."
positive_definition: "Ставка названа корректно либо сотрудник говорит, что ставку нужно уточнить/согласовать."
negative_definition: "Ставка не названа, названа неоднозначно, обещана без условий или без согласования."
good_examples:
  - "Ставка составляет 15 процентов, окончательное значение проверю перед открытием."
bad_examples:
  - "Гарантирую максимальную ставку без дополнительного согласования."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_05. Верни score=0, если подтверждён триггер нарушения: Ставка не названа, названа неоднозначно, обещана без условий или без согласования. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: significant
penalty: 10
quote_required: true
recommendation: "При предложении вклада называйте ставку корректно и указывайте, если она требует согласования."
