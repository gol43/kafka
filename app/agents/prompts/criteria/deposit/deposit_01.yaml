code: "DEP_01"
title_positive: "Сотрудник сообщил о приближении окончания или завершении вклада"
title_negative: "Менеджер не сообщил причину контакта по вкладу"
description: "Менеджер должен объяснить причину звонка: у клиента закончился или скоро заканчивается вклад/депозит, либо есть вопрос по переоткрытию/пролонгации."
rules: "Звонок про вклад, депозит, переоформление, пролонгацию или размещение средств. Этап коммуникации: Завершение и следующий шаг. Когда не применять: Клиент уже полностью сформулировал запрос и необходимые параметры известны.. Обязательная проверка: Уточнить только существенные для решения параметры: сумма, срок, доступность, пополнение/снятие, цель.."
trigger: "Менеджер сразу переходит к продукту или ставке, не объясняя клиенту причину контакта."
positive_definition: "Менеджер корректно сообщает, что вклад закончился/заканчивается, или подтверждает запрос клиента по вкладу."
negative_definition: "Менеджер сразу переходит к продукту или ставке, не объясняя клиенту причину контакта."
good_examples:
  - "Звоню, потому что срок вашего вклада скоро заканчивается."
bad_examples:
  - "Предлагаю сразу перейти к новой ставке."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_01. Верни score=0, если подтверждён триггер нарушения: Менеджер сразу переходит к продукту или ставке, не объясняя клиенту причину контакта. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: minor
penalty: 5
quote_required: true
recommendation: "В начале звонка кратко обозначайте причину контакта: окончание вклада, переоформление, пролонгация или запрос клиента."
