code: "DEP_11"
title_positive: "Отсутствует фрод: сотрудник не подсказывает клиенту схему получения Особого Плюса"
title_negative: "Выявлен фрод"
description: "Запрещено обучать клиента, что нужно сказать для получения закрытого предложения или индивидуальной ставки."
rules: "Любой звонок, где обсуждается Особый Плюс, закрытая линейка или индивидуальные условия. Этап коммуникации: Сквозной контроль. Обязательная проверка: Проверить критерий «Отсутствует фрод: сотрудник не подсказывает клиенту схему получения Особого Плюса» по всему релевантному фрагменту диалога, а не по одной реплике.."
trigger: "Сотрудник говорит клиенту, что надо заявить недовольство ставкой или сказать, что в другом банке лучше, чтобы получить Особый Плюс."
positive_definition: "Сотрудник не инструктирует клиента, как обойти технологию продаж или получить закрытое предложение."
negative_definition: "Сотрудник говорит клиенту, что надо заявить недовольство ставкой или сказать, что в другом банке лучше, чтобы получить Особый Плюс."
good_examples:
  - "Проверим доступные предложения по установленной процедуре."
bad_examples:
  - "Скажите, что в другом банке ставка выше, тогда вам откроют Особый Плюс."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_11. Верни score=0, если подтверждён триггер нарушения: Сотрудник говорит клиенту, что надо заявить недовольство ставкой или сказать, что в другом банке лучше, чтобы получить Особый Плюс. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: critical
penalty: 100
quote_required: true
recommendation: "Категорически нельзя подсказывать клиенту сценарий получения закрытого предложения. Это hard red / фрод."
