code: DEP_07
title_positive: Корректно раскрыты ключевые условия вклада
title_negative: Ключевые условия вклада не раскрыты
description: 'Клиенту должны быть понятны ключевые условия: пополнение, снятие, новые деньги, капитализация, выплата процентов, минимальная сумма, если они применимы.'
rules: Любое предложение вклада, особенно Особый Плюс или индивидуальная ставка.
trigger: Сотрудник называет только ставку, но не раскрывает ключевые ограничения или условия, важные для решения клиента.
positive_definition: Сотрудник раскрывает существенные условия или явно предлагает их уточнить перед открытием.
negative_definition: Сотрудник называет только ставку, но не раскрывает ключевые ограничения или условия, важные для решения клиента.
good_examples:
- Сотрудник раскрывает существенные условия или явно предлагает их уточнить перед открытием.
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_07.
block: deposit
severity: significant
penalty: 10
