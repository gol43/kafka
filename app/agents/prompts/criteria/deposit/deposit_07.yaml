code: "DEP_07"
title_positive: "Корректно раскрыты ключевые условия вклада"
title_negative: "Ключевые условия вклада не раскрыты"
description: "Клиенту должны быть понятны ключевые условия: пополнение, снятие, новые деньги, капитализация, выплата процентов, минимальная сумма, если они применимы."
rules: "Любое предложение вклада, особенно Особый Плюс или индивидуальная ставка. Этап коммуникации: Предложение и консультация. Обязательная проверка: Проверить полноту раскрытия: ставка, срок и ключевые ограничения продукта.."
trigger: "Сотрудник называет только ставку, но не раскрывает ключевые ограничения или условия, важные для решения клиента."
positive_definition: "Сотрудник раскрывает существенные условия или явно предлагает их уточнить перед открытием."
negative_definition: "Сотрудник называет только ставку, но не раскрывает ключевые ограничения или условия, важные для решения клиента."
good_examples:
  - "Вклад открывается на год, минимальная сумма — сто тысяч, пополнение и снятие не предусмотрены."
bad_examples:
  - "Главное — высокая ставка, остальные условия можно не обсуждать."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_07. Верни score=0, если подтверждён триггер нарушения: Сотрудник называет только ставку, но не раскрывает ключевые ограничения или условия, важные для решения клиента. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: significant
penalty: 10
quote_required: true
recommendation: "Раскрывайте не только ставку, но и ключевые условия: срок, сумму, пополнение/снятие, новые деньги, выплату процентов."
