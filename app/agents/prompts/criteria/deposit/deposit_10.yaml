code: "DEP_10"
title_positive: "Нет запрещенных обещаний"
title_negative: "Допущены запрещённые обещания"
description: "Менеджер не должен гарантировать недоступные условия, обещать согласование или ставку без оснований."
rules: "Любой разговор по вкладам и индивидуальным предложениям. Этап коммуникации: Сквозной контроль. Обязательная проверка: Проверить критерий «Нет запрещенных обещаний» по всему релевантному фрагменту диалога, а не по одной реплике.."
trigger: "Обещана гарантированная ставка/согласование/условия, которые должны быть проверены или согласованы."
positive_definition: "Формулировки осторожные: «можем уточнить», «направлю на согласование», «посмотрим доступные условия»."
negative_definition: "Обещана гарантированная ставка/согласование/условия, которые должны быть проверены или согласованы."
good_examples:
  - "Можем направить условия на согласование и проверить доступную ставку."
bad_examples:
  - "Гарантирую, что вам согласуют эту ставку."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_10. Верни score=0, если подтверждён триггер нарушения: Обещана гарантированная ставка/согласование/условия, которые должны быть проверены или согласованы. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: critical
penalty: 25
quote_required: true
recommendation: "Не обещайте условия до проверки и согласования. Используйте корректные формулировки с оговоркой о доступности."
