code: DEP_02
title_positive: Сначала предложена публичная линейка вкладов
title_negative: Публичная линейка вкладов не предложена первой
description: 'Перед индивидуальным/закрытым предложением сотрудник должен предложить стандартные публичные вклады: СберВклад Лидер, СберВклад Премьер, Лучший Процент, Ключевой Лидер или другие стандартные вклады.'
rules: Есть предложение нового вклада или переоткрытия вклада.
trigger: Сотрудник сразу упоминает Особый Плюс, закрытый вклад, индивидуальное предложение или согласование через центральный аппарат.
positive_definition: Сначала предложены публичные вклады или стандартная линейка, без преждевременного перехода к Особому Плюсу.
negative_definition: Сотрудник сразу упоминает Особый Плюс, закрытый вклад, индивидуальное предложение или согласование через центральный аппарат.
good_examples:
- Сначала предложены публичные вклады или стандартная линейка, без преждевременного перехода к Особому Плюсу.
bad_examples: []
output_rule: Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_02.
block: deposit
severity: critical
penalty: 20
quote_required: true
recommendation: Сначала предлагайте публичную линейку вкладов. Индивидуальный вклад используйте только после отказа клиента или сигнала о лучших условиях у конкурентов.
