code: "DEP_02"
title_positive: "Сначала предложена публичная линейка вкладов"
title_negative: "Публичная линейка вкладов не предложена первой"
description: "Перед индивидуальным/закрытым предложением сотрудник должен предложить стандартные публичные вклады: СберВклад Лидер, СберВклад Премьер, Лучший Процент, Ключевой Лидер или другие стандартные вклады."
rules: "Есть предложение нового вклада или переоткрытия вклада. Этап коммуникации: Начало коммуникации. Когда не применять: Клиент уже полностью сформулировал запрос и необходимые параметры известны.. Обязательная проверка: Уточнить только существенные для решения параметры: сумма, срок, доступность, пополнение/снятие, цель.."
trigger: "Сотрудник сразу упоминает Особый Плюс, закрытый вклад, индивидуальное предложение или согласование через центральный аппарат."
positive_definition: "Сначала предложены публичные вклады или стандартная линейка, без преждевременного перехода к Особому Плюсу."
negative_definition: "Сотрудник сразу упоминает Особый Плюс, закрытый вклад, индивидуальное предложение или согласование через центральный аппарат."
good_examples:
  - "Сначала рассмотрим стандартную публичную линейку вкладов."
bad_examples:
  - "Сразу предложу вам закрытый вклад Особый Плюс."
output_rule: "Если выполнен триггер нарушения и отсутствует верный сигнал, зафиксировать DEP_02. Верни score=0, если подтверждён триггер нарушения: Сотрудник сразу упоминает Особый Плюс, закрытый вклад, индивидуальное предложение или согласование через центральный аппарат. Во всех остальных случаях верни score=1. При score=0 и обязательной цитате верни точную короткую цитату из диалога. Не допускай типовую ошибку: Агент может признать сам факт предложения достаточным, не проверив полноту консультации."
block: deposit
severity: critical
penalty: 20
quote_required: true
recommendation: "Сначала предлагайте публичную линейку вкладов. Индивидуальный вклад используйте только после отказа клиента или сигнала о лучших условиях у конкурентов."
